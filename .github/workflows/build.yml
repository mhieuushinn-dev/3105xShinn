name: ShinnH4K
options:
  bundleIdPrefix: com.shinn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  objectVersion: 56
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  ShinnH4K:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShinnH4K-Sources
    settings:
      base:
        PRODUCT_NAME: ShinnH4K
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ShinnH4K-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)"
          - "$(SRCROOT)/ShinnH4K-Sources"
          - "$(SRCROOT)/ShinnH4K-Sources/exploit"
          - "$(SRCROOT)/ShinnH4K-Sources/kexploit"
          - "$(SRCROOT)/ShinnH4K-Sources/helpers"
        OTHER_LDFLAGS: "-lz"
        OTHER_CFLAGS: "-Wno-everything"
        ENABLE_BITCODE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"