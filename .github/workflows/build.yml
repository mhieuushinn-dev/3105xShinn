name: Build ShinnH4K

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          ls -la
          ls -la exploit/ 2>&1 || true
          ls -la kexploit/ 2>&1 || true

      - name: Install XcodeGen
        run: |
          curl -L -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -q xcodegen.zip
          sudo mv xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate project
        run: |
          xcodegen generate
          ls -la ShinnH4K.xcodeproj/ || echo "MISSING"
          head -5 ShinnH4K.xcodeproj/project.pbxproj || echo "MISSING pbxproj"

      - name: Verify
        run: xcodebuild -list -project ShinnH4K.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ShinnH4K.xcodeproj \
            -scheme ShinnH4K \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShinnH4K.app Payload/
          zip -qr ShinnH4K.ipa Payload
          ls -la ShinnH4K.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4K-ipa
          path: ShinnH4K.ipa