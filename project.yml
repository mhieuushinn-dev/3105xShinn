name: ShinnH4K
options:
  bundleIdPrefix: com.shinn
  deploymentTarget:
    iOS: "17.0"

targets:
  ShinnH4K:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - .github
          - build
          - "*.m"
          - "*.h"
          - "*.c"
          - "*.xcodeproj"
          - "kexploit/**"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shinn.shinnh4k
      INFOPLIST_FILE: Info.plist
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
